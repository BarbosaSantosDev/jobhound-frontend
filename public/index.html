<!DOCTYPE html>
<html lang="pt-BR" data-theme="escuro">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="any" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#14120F" />
    <meta
      name="description"
      content="jobhound: agente open source que fareja vagas e avisa só das que combinam com você."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>jobhound</title>
    <script>
      // Aplica o tema antes do primeiro paint. Mesma regra de src/theme/theme.js:
      // escolha salva > prefers-color-scheme.
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem("jobhound.theme");
        } catch (e) {}
        if (theme !== "claro" && theme !== "escuro") {
          theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches
            ? "claro"
            : "escuro";
        }
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <noscript>Ative o JavaScript para usar o jobhound.</noscript>
    <div id="root"></div>
  </body>
</html>
